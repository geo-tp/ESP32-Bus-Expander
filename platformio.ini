; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:c5slave]
board_build.partitions = partitions/app4M_spiffs_zigbee_4MB.csv
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -Wl,-zmuldefs ; ieee80211_raw_frame_sanity_check override - needed for WiFi deauth
    ; Default Zigbee build: Coordinator/Router
    ; -D ZIGBEE_MODE_ED
    -D ZIGBEE_MODE_ZCZR
    -D RX_PIN=9    ; UART RX
    -D TX_PIN=10   ; UART TX
    -D BAUD=115200 ; UART baud rate, using SERIAL 8N1
    -D LED_PIN=27  ; ESP32-C5 has an onboard LED
    -D BUS_EXPANDER_C5

lib_deps = 
    adafruit/Adafruit NeoPixel@^1.15.4
    miq19/eModbus@^1.7.4
    bblanchon/ArduinoJson@^7.3.0

; =========================================================
; ESP32-C6 slave - Zigbee ZCZR mode (Coordinator + Router)
; Requires the zigbee partition scheme (zb_storage + zb_fct)
; =========================================================
[env:c6slave]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; The same Zigbee implementation and SDK mode are used by c5slave.
board_build.partitions = partitions/app4M_spiffs_zigbee_8MB.csv
board_upload.flash_size = 8MB
build_flags = 
    -Wl,-zmuldefs ; ieee80211_raw_frame_sanity_check override - needed for WiFi deauth
    ; Default Zigbee build: Coordinator/Router
    ; -D ZIGBEE_MODE_ED
    -D ZIGBEE_MODE_ZCZR
    -D TERMINAL_UART1
    -D RX_PIN=18   ; UART1 RX from host
    -D TX_PIN=19   ; UART1 TX to host
    -D BAUD=115200 ; UART baud rate, using SERIAL 8N1
    -D LED_PIN=8   ; onboard WS2812 on DevKitM-1 (strapping pin, board-wired)
    -D BUS_EXPANDER_C6

lib_deps = 
    adafruit/Adafruit NeoPixel@^1.15.4
    miq19/eModbus@^1.7.4
    bblanchon/ArduinoJson@^7.3.0

; =========================================================
; Native Tests environment (for running unit tests on the host machine)
; =========================================================

[env:native-tests]
platform = native
framework =
build_flags =
  -std=gnu++17
lib_deps =
  throwtheswitch/Unity@^2.6.1
test_build_src = no
test_framework = unity
